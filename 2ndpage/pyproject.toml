[project]
name = "andenside"
version = "0.1.0"
description = "Metodetest for transskription af andensider i Blegdamshospitalets patientjournaler"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
andenside = "andenside.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/andenside"]

[tool.pytest.ini_options]
testpaths = ["tests"]
